publish_to: none
version: 1.1.0+2

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  cross_file: ^0.3.4+2
  share_plus: ^11.1.0
  gal: ^2.3.3
  pdf: ^3.12.0
